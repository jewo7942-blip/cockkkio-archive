<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>콕끼오 LUCKY SLOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --court: #0E3A2C;
    --court-deep: #082921;
    --card: #103F30;
    --chalk: #F6F3EA;
    --ink: #10181C;
    --accent: #C6FF4D;
    --line: rgba(246,243,234,0.16);
    --muted: rgba(246,243,234,0.62);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{
    min-height:100%;
    background: var(--court-deep);
  }
  body{
    font-family:'Noto Sans KR', sans-serif;
    color:var(--chalk);
    background:
      linear-gradient(180deg, var(--court) 0%, var(--court-deep) 65%),
      repeating-linear-gradient(0deg, transparent 0 78px, var(--line) 78px 79px),
      repeating-linear-gradient(90deg, transparent 0 78px, var(--line) 78px 79px);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:calc(28px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
    position:relative;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  .wrap{ width:100%; max-width:420px; text-align:center; position:relative; z-index:2; }

  .mute-btn{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top));
    right:16px;
    z-index:20;
    width:38px; height:38px;
    border-radius:50%;
    background:rgba(16,24,28,0.55);
    border:1px solid var(--line);
    color:var(--chalk);
    display:flex; align-items:center; justify-content:center;
  }
  .mute-btn svg{ width:18px; height:18px; }

  .hero-logo{
    width:76px; height:76px;
    margin:0 auto 10px;
    object-fit:contain;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));
  }
  .brand-line{
    font-size:12px; letter-spacing:.28em; font-weight:700;
    color:var(--muted);
  }
  h1.title{
    font-family:'Black Han Sans', sans-serif;
    font-size:clamp(30px, 9vw, 40px);
    color:var(--accent);
    letter-spacing:.02em;
    margin-top:2px;
  }
  .sub{
    margin-top:10px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--muted);
  }

  /* ---------- round card ---------- */
  .round-card{
    margin-top:22px;
    background:rgba(246,243,234,0.05);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    text-align:left;
  }
  .round-head{
    display:flex; align-items:center; justify-content:space-between;
  }
  .round-num{
    font-family:'Black Han Sans', sans-serif;
    font-size:15px; letter-spacing:.03em;
  }
  .round-status{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:700; letter-spacing:.04em;
    padding:4px 10px; border-radius:999px;
  }
  .round-status.open{ background:rgba(198,255,77,0.15); color:var(--accent); }
  .round-status.closed{ background:rgba(246,243,234,0.08); color:var(--muted); }
  .round-status.soon{ background:transparent; border:1px solid var(--line); color:var(--muted); }
  .round-status .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .round-body{
    margin-top:10px;
    display:flex;
    gap:18px;
  }
  .round-field{ }
  .round-field .l{ font-size:11px; color:var(--muted); }
  .round-field .v{ font-size:14px; font-weight:700; margin-top:2px; }

  /* ---------- slot machine ---------- */
  .slot-frame{
    margin-top:24px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:22px 16px 20px;
    box-shadow:inset 0 0 0 1px rgba(198,255,77,0.06), 0 20px 40px rgba(0,0,0,.35);
  }
  .reels{
    display:flex;
    gap:10px;
    justify-content:center;
  }
  .reel{
    width:30%;
    aspect-ratio:1/1;
    max-width:104px;
    border-radius:14px;
    background:var(--court-deep);
    border:2px solid rgba(198,255,77,0.25);
    overflow:hidden;
    position:relative;
  }
  .reel::before, .reel::after{
    content:"";
    position:absolute; left:0; right:0; height:26%;
    z-index:2; pointer-events:none;
  }
  .reel::before{ top:0; background:linear-gradient(180deg, var(--court-deep), transparent); }
  .reel::after{ bottom:0; background:linear-gradient(0deg, var(--court-deep), transparent); }
  .reel-strip{
    display:flex;
    flex-direction:column;
    will-change:transform;
  }
  .sym{
    width:100%;
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
  }
  .sym img{ width:58%; height:58%; object-fit:contain; }
  .sym svg{ width:46%; height:46%; }

  .spin-btn{
    margin-top:20px;
    width:100%;
    padding:18px;
    border:none;
    border-radius:999px;
    background:var(--accent);
    color:var(--ink);
    font-family:'Black Han Sans', sans-serif;
    font-size:19px;
    letter-spacing:.04em;
  }
  .spin-btn:disabled{ opacity:.45; }
  .spin-btn:active:not(:disabled){ transform:scale(.98); }

  .participate-note{
    margin-top:12px;
    font-size:12px;
    color:var(--muted);
    min-height:16px;
  }

  /* ---------- result overlay ---------- */
  #resultOverlay{
    position:fixed; inset:0; z-index:40;
    background:rgba(4,14,10,0.92);
    display:none;
    align-items:center; justify-content:center;
    padding:26px;
  }
  #resultOverlay.open{ display:flex; }
  .result-card{
    width:100%; max-width:360px;
    text-align:center;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:34px 24px 26px;
    position:relative;
    overflow:hidden;
  }
  .result-card.win{
    border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(198,255,77,0.3), 0 0 40px rgba(198,255,77,0.25);
  }
  .result-title{
    font-family:'Black Han Sans', sans-serif;
    font-size:34px;
    letter-spacing:.02em;
  }
  .result-title.win{ color:var(--accent); }
  .result-title.lose{ color:var(--chalk); opacity:.9; }
  .result-title.near{ color:#FFD86B; }
  .result-symbols{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:16px;
  }
  .result-symbols .rsym{
    width:52px; height:52px;
    border-radius:12px;
    background:var(--court-deep);
    border:1px solid rgba(198,255,77,0.25);
    display:flex; align-items:center; justify-content:center;
  }
  .result-symbols .rsym img{ width:60%; height:60%; object-fit:contain; }
  .result-symbols .rsym svg{ width:48%; height:48%; }
  .result-desc{
    margin-top:12px;
    font-size:14px;
    line-height:1.7;
    color:var(--muted);
  }
  .result-meta{
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:11.5px;
    color:var(--muted);
    line-height:1.9;
    text-align:left;
  }
  .result-meta b{ color:var(--chalk); }
  .result-close{
    margin-top:22px;
    width:100%;
    padding:14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--chalk);
    font-size:14px;
  }

  #confettiLayer{
    position:fixed; inset:0; z-index:45;
    pointer-events:none;
    overflow:hidden;
    display:none;
  }
  #confettiLayer.on{ display:block; }
  .confetti-piece{
    position:absolute;
    top:-14px;
    width:8px; height:14px;
    opacity:.95;
    animation: confettiFall 1.6s ease-in forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(540deg); opacity:0; }
  }

  /* ---------- demo panel ---------- */
  #demoPanel{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:30;
    display:none;
    gap:8px;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(6px);
  }
  #demoPanel.on{ display:flex; }
  #demoPanel button{
    flex:1;
    padding:10px 4px;
    font-size:11.5px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(246,243,234,0.08);
    color:var(--chalk);
  }

  @media (prefers-reduced-motion: reduce){
    .reel-strip{ transition:none !important; }
    .confetti-piece{ animation:none !important; }
  }
</style>
</head>
<body>

<button class="mute-btn" id="muteBtn" aria-label="음소거">
  <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9v6h4l5 4V5L8 9H4z"/>
    <path d="M16 8a5 5 0 0 1 0 8"/>
  </svg>
</button>

<div class="wrap">
  <img class="hero-logo" src="assets/brand/logo.png" alt="콕끼오">
  <div class="brand-line">COCKKKIO</div>
  <h1 class="title">LUCKY SLOT</h1>
  <p class="sub" id="subCopy">행운의 슬롯을 돌려보세요.<br>이번 라운드의 주인공은 누구일까요?</p>

  <!-- ROUND INFO -->
  <div class="round-card" id="roundCard">
    <div class="round-head">
      <div class="round-num" id="roundNumLabel">ROUND --</div>
      <div class="round-status soon" id="roundStatusBadge"><span class="dot"></span><span id="roundStatusText">불러오는 중</span></div>
    </div>
    <div class="round-body">
      <div class="round-field">
        <div class="l">상품</div>
        <div class="v" id="roundPrizeLabel">준비중</div>
      </div>
      <div class="round-field">
        <div class="l">참여</div>
        <div class="v" id="roundJoinLabel">준비중</div>
      </div>
    </div>
  </div>

  <!-- SLOT MACHINE -->
  <div class="slot-frame">
    <div class="reels">
      <div class="reel"><div class="reel-strip" id="reel0"></div></div>
      <div class="reel"><div class="reel-strip" id="reel1"></div></div>
      <div class="reel"><div class="reel-strip" id="reel2"></div></div>
    </div>
    <button type="button" class="spin-btn" id="spinBtn" disabled>SPIN</button>
    <p class="participate-note" id="participateNote"></p>
  </div>

  <img class="hero-logo" style="display:none" src="assets/brand/logo.png" alt="">
</div>

<div id="confettiLayer" aria-hidden="true"></div>

<div id="resultOverlay">
  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultTitle">JACKPOT!</div>
    <div class="result-symbols" id="resultSymbols"></div>
    <div class="result-desc" id="resultDesc">축하합니다!<br>당첨되었습니다.<br>운영진에게 이 화면을 보여주세요.</div>
    <div class="result-meta" id="resultMeta"></div>
    <button type="button" class="result-close" id="resultCloseBtn">닫기</button>
  </div>
</div>

<div id="demoPanel">
  <button type="button" id="demoWin">FORCE WIN</button>
  <button type="button" id="demoLose">FORCE LOSE</button>
  <button type="button" id="demoNear">FORCE NEAR MISS</button>
  <button type="button" id="demoReset">RESET</button>
</div>

<script>
/* =====================================================================
   SYMBOLS
===================================================================== */
const SYM = {
  logo: `<img src="assets/brand/logo.png" alt="">`,
  court: `<img src="assets/brand/symbol-court.png" alt="">`,
  badge: `<img src="assets/brand/symbol-badge.png" alt="">`,
};
const SEQUENCE = ['court','badge','logo']; // base loop order
const LOOPS = 7; // how many times the base sequence repeats in a reel strip
const ITEM_H_RATIO = 1; // each symbol is a square matching reel width

/* =====================================================================
   DATA LAYER
   -----------------------------------------------------------------
   구글 시트 + Apps Script와 연결되는 부분이에요.
   배포 후 발급받은 웹 앱 URL을 APPS_SCRIPT_URL에 붙여넣으면
   자동으로 실제 시트를 사용해요. 비워두면 지금처럼 로컬 데모로 동작해요.
===================================================================== */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfzW0RZq73YfZW3htUC9N93NFDguluD6fed4ydpl-I40bLSX0JNULcEwABlqhNXQBHvA/exec";
const USE_BACKEND = APPS_SCRIPT_URL.length > 0;

const DEMO_ROUND = {
  roundNumber: 1,
  status: 'OPEN', // 'OPEN' | 'CLOSED' | 'COMING_SOON'
  prizeLabel: '음료 1개',
};
const DEMO_WIN_RATE = 0.15; // 데모용 임시 확률 (백엔드 연결 전까지만 사용)

function storageKey(kind, roundNumber, keyringId){
  return `cockkkio_slot_${kind}_r${roundNumber}_id${keyringId}`;
}

async function getCurrentRound(){
  if(USE_BACKEND){
    try{
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getCurrentRound`);
      return await res.json();
    }catch(e){ /* 네트워크 오류 시 데모로 폴백 */ }
  }
  return Promise.resolve({ ...DEMO_ROUND });
}

async function checkParticipation(keyringId, roundNumber){
  if(USE_BACKEND){
    try{
      const url = `${APPS_SCRIPT_URL}?action=checkParticipation&keyringId=${encodeURIComponent(keyringId)}&roundNumber=${encodeURIComponent(roundNumber)}`;
      const res = await fetch(url);
      return await res.json();
    }catch(e){ /* 네트워크 오류 시 로컬 캐시로 폴백 */ }
  }
  try{
    const raw = localStorage.getItem(storageKey('result', roundNumber, keyringId));
    if(raw) return { participated:true, result: JSON.parse(raw) };
  }catch(e){}
  return { participated:false, result:null };
}

async function requestDraw(keyringId, roundNumber){
  if(USE_BACKEND){
    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // Apps Script CORS 프리플라이트 회피용
        body: JSON.stringify({ action:'requestDraw', keyringId, roundNumber })
      });
      return await res.json();
    }catch(e){ /* 네트워크 오류 시 데모 확률로 폴백 */ }
  }
  const win = Math.random() < DEMO_WIN_RATE;
  return Promise.resolve({ win, at: Date.now() });
}

function saveDrawResult(keyringId, roundNumber, result){
  // 백엔드 사용 시 서버(Plays 시트)에는 requestDraw 안에서 이미 기록됨.
  // 여기서는 재방문 시 빠르게 보여주기 위한 로컬 캐시만 저장.
  try{
    localStorage.setItem(storageKey('result', roundNumber, keyringId), JSON.stringify(result));
  }catch(e){}
}

/* =====================================================================
   UI STATE
===================================================================== */
const params = new URLSearchParams(window.location.search);
const keyringId = params.get('id') || 'guest';
const demoMode = params.get('demo') === '1';

let currentRound = null;
let spinning = false;
let already = null;

const spinBtn = document.getElementById('spinBtn');
const participateNote = document.getElementById('participateNote');

/* ---------- sound (synthesized, no external files) ---------- */
let audioCtx = null;
let muted = false;
try{ muted = localStorage.getItem('cockkkio_slot_muted') === '1'; }catch(e){}
updateMuteIcon();

function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  return audioCtx;
}
function tone(freq, dur, type, vol){
  if(muted) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.value = vol || 0.06;
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  osc.stop(ctx.currentTime + dur);
}
function playTick(){ tone(520, .08, 'square', .05); }
function playSpinStart(){ tone(300, .12, 'sawtooth', .04); }
function playJackpot(){
  [660, 880, 1100, 1320].forEach((f,i) => setTimeout(() => tone(f, .22, 'triangle', .07), i*90));
}
function playLose(){ tone(180, .25, 'sine', .05); }

document.getElementById('muteBtn').addEventListener('click', () => {
  muted = !muted;
  try{ localStorage.setItem('cockkkio_slot_muted', muted ? '1' : '0'); }catch(e){}
  updateMuteIcon();
});
function updateMuteIcon(){
  document.getElementById('muteIcon').style.opacity = muted ? '.4' : '1';
}

/* ---------- reels ---------- */
function buildReel(reelEl){
  let html = '';
  for(let i=0;i<LOOPS;i++){
    SEQUENCE.forEach(symId => { html += `<div class="sym">${SYM[symId]}</div>`; });
  }
  reelEl.innerHTML = html;
  return SEQUENCE.length * LOOPS;
}
const reelEls = [document.getElementById('reel0'), document.getElementById('reel1'), document.getElementById('reel2')];
reelEls.forEach(buildReel);

function reelItemHeight(reelEl){
  return reelEl.parentElement.clientWidth; // square symbols, width === height
}

// land a given reel on a target symbol id, landing near the given loop index for travel distance
function spinReelTo(reelEl, targetSymId, loopIndex, duration, delay, onDone){
  const h = reelItemHeight(reelEl);
  const seqLen = SEQUENCE.length;
  const posInSeq = SEQUENCE.indexOf(targetSymId);
  const targetIndex = loopIndex * seqLen + posInSeq;
  const overshoot = targetIndex + 1; // slight bounce past target

  reelEl.style.transition = 'none';
  reelEl.style.transform = 'translateY(0px)';
  // force reflow
  void reelEl.offsetHeight;

  setTimeout(() => {
    reelEl.style.transition = `transform ${duration}ms cubic-bezier(.12,.85,.15,1)`;
    reelEl.style.transform = `translateY(${-(overshoot*h)}px)`;

    const settle = () => {
      reelEl.removeEventListener('transitionend', settle);
      reelEl.style.transition = 'transform 160ms ease-out';
      reelEl.style.transform = `translateY(${-(targetIndex*h)}px)`;
      playTick();
      if(onDone) onDone();
    };
    reelEl.addEventListener('transitionend', settle);
  }, delay);
}

/* ---------- round rendering ---------- */
function renderRound(round){
  const badge = document.getElementById('roundStatusBadge');
  const statusText = document.getElementById('roundStatusText');
  const numLabel = document.getElementById('roundNumLabel');
  const prizeLabel = document.getElementById('roundPrizeLabel');
  const joinLabel = document.getElementById('roundJoinLabel');

  numLabel.textContent = `ROUND ${String(round.roundNumber).padStart(2,'0')}`;
  prizeLabel.textContent = round.prizeLabel;

  badge.className = 'round-status';
  if(round.status === 'OPEN'){
    badge.classList.add('open');
    statusText.textContent = '진행 중';
    joinLabel.textContent = '1회';
  }else if(round.status === 'CLOSED'){
    badge.classList.add('closed');
    statusText.textContent = 'CLOSED';
    joinLabel.textContent = '마감';
  }else{
    badge.classList.add('soon');
    statusText.textContent = 'COMING SOON';
    joinLabel.textContent = '-';
  }
}

function setSpinState(mode, note){
  // mode: 'ready' (can spin) | 'already' (played — can re-view result) | 'locked' (round not open)
  participateNote.textContent = note || '';
  if(mode === 'ready'){
    spinBtn.disabled = false;
    spinBtn.textContent = 'SPIN';
    spinBtn.dataset.mode = 'spin';
  }else if(mode === 'already'){
    spinBtn.disabled = false;
    spinBtn.textContent = '내 결과 다시 보기';
    spinBtn.dataset.mode = 'view';
  }else if(mode === 'spinning'){
    spinBtn.disabled = true;
  }else{
    spinBtn.disabled = true;
    spinBtn.textContent = 'SPIN';
    spinBtn.dataset.mode = 'spin';
  }
}

function symbolsForKind(kind){
  if(kind === 'WIN') return ['logo','logo','logo'];
  const other = SEQUENCE.find(s => s !== 'logo') || SEQUENCE[0];
  if(kind === 'NEAR') return ['logo','logo', other];
  const others = SEQUENCE.filter(s => s !== 'logo');
  return [others[0] || other, others[1] || other, others[0] || other];
}

function reopenResult(){
  if(!already) return;
  const meta = { roundNumber: currentRound.roundNumber, keyringId, at: already.at };
  const kind = already.kind === 'WIN' ? 'WIN' : (already.kind === 'NEAR' ? 'NEAR' : 'LOSE');
  const symbols = already.symbols || symbolsForKind(kind);
  showResult(kind, meta, symbols, true);
}

/* ---------- result overlay ---------- */
function showResult(kind, meta, symbols, quiet){
  const overlay = document.getElementById('resultOverlay');
  const card = document.getElementById('resultCard');
  const title = document.getElementById('resultTitle');
  const symbolsEl = document.getElementById('resultSymbols');
  const desc = document.getElementById('resultDesc');
  const metaEl = document.getElementById('resultMeta');

  card.classList.remove('win');
  title.classList.remove('win','lose','near');

  if(symbols && symbols.length === 3){
    symbolsEl.innerHTML = symbols.map(id => `<div class="rsym">${SYM[id] || ''}</div>`).join('');
  }else{
    symbolsEl.innerHTML = '';
  }

  if(kind === 'WIN'){
    card.classList.add('win');
    title.classList.add('win');
    title.textContent = 'JACKPOT!';
    desc.innerHTML = '축하합니다!<br>당첨되었습니다.<br>운영진에게 이 화면을 보여주세요.';
    if(!quiet){
      playJackpot();
      if(navigator.vibrate){ try{ navigator.vibrate([40,30,60]); }catch(e){} }
      burstConfetti();
    }
  }else if(kind === 'NEAR'){
    title.classList.add('near');
    title.textContent = 'SO CLOSE!';
    desc.innerHTML = '아쉽습니다!<br>다음 기회를 기대해주세요.';
    if(!quiet) playLose();
  }else{
    title.classList.add('lose');
    title.textContent = 'NOT THIS TIME';
    desc.innerHTML = '아쉽습니다!<br>다음 기회를 기대해주세요.';
    if(!quiet) playLose();
  }

  metaEl.innerHTML = `ROUND · <b>${String(meta.roundNumber).padStart(2,'0')}</b><br>참여 ID · <b>${meta.keyringId}</b><br>시간 · <b>${new Date(meta.at).toLocaleString('ko-KR')}</b>`;

  overlay.classList.add('open');
}
document.getElementById('resultCloseBtn').addEventListener('click', () => {
  document.getElementById('resultOverlay').classList.remove('open');
});

function burstConfetti(){
  const layer = document.getElementById('confettiLayer');
  layer.innerHTML = '';
  layer.classList.add('on');
  const colors = ['#C6FF4D','#F6F3EA','#FFD86B','#7CE3C4'];
  for(let i=0;i<36;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random()*0.3) + 's';
    p.style.animationDuration = (1.2 + Math.random()*0.8) + 's';
    layer.appendChild(p);
  }
  setTimeout(() => { layer.classList.remove('on'); layer.innerHTML=''; }, 2200);
}

/* ---------- spin orchestration ---------- */
function pickLoseSymbols(){
  const NEAR_MISS_CHANCE = 0.35;
  if(Math.random() < NEAR_MISS_CHANCE){
    // logo, logo, (something else) — near miss, last reel decides
    const others = SEQUENCE.filter(s => s !== 'logo');
    const third = others[Math.floor(Math.random()*others.length)];
    return { symbols:['logo','logo',third], kind:'NEAR' };
  }
  // plain lose combo — avoid accidentally matching 3 logos
  let symbols;
  do{
    symbols = [0,1,2].map(() => SEQUENCE[Math.floor(Math.random()*SEQUENCE.length)]);
  }while(symbols[0]==='logo' && symbols[1]==='logo' && symbols[2]==='logo');
  return { symbols, kind:'LOSE' };
}

async function playSpin(forcedResult){
  if(spinning) return;
  if(!currentRound) return; // 라운드 정보가 아직 안 불러와졌으면 아무것도 하지 않음 (안전장치)
  spinning = true;
  setSpinState('spinning', '스핀 중...');
  playSpinStart();

  let outcome;
  if(forcedResult){
    outcome = forcedResult;
  }else{
    outcome = await requestDraw(keyringId, currentRound.roundNumber);
  }

  let symbols, kind;
  if(outcome.win){
    symbols = ['logo','logo','logo'];
    kind = 'WIN';
  }else{
    const picked = pickLoseSymbols();
    symbols = picked.symbols;
    kind = picked.kind;
  }

  const loopBase = LOOPS - 2; // land within the strip, leaving travel room
  const durations = [900, 1400, kind === 'NEAR' ? 2600 : 2100];
  const delays = [0, 250, 550];
  const PAUSE_BEFORE_MODAL = 900; // 릴이 멈춘 걸 보여줄 시간 (모달이 바로 안 뜨게)

  let finished = 0;
  reelEls.forEach((reelEl, i) => {
    spinReelTo(reelEl, symbols[i], loopBase, durations[i], delays[i], () => {
      finished++;
      if(finished === 3){
        setTimeout(() => {
          const meta = { roundNumber: currentRound.roundNumber, keyringId, at: Date.now() };
          if(!forcedResult){
            const resultToSave = { win: outcome.win, symbols, kind, at: meta.at };
            saveDrawResult(keyringId, currentRound.roundNumber, resultToSave);
            already = resultToSave;
          }
          showResult(kind === 'WIN' ? 'WIN' : (kind === 'NEAR' ? 'NEAR' : 'LOSE'), meta, symbols);
          spinning = false;
          if(currentRound.status === 'OPEN' && !forcedResult){
            setSpinState('already', '이번 라운드는 이미 참여하셨어요');
          }
        }, PAUSE_BEFORE_MODAL);
      }
    });
  });
}

spinBtn.addEventListener('click', () => {
  if(spinBtn.dataset.mode === 'view'){
    reopenResult();
  }else{
    playSpin();
  }
});

/* ---------- demo panel ---------- */
if(demoMode){
  document.getElementById('demoPanel').classList.add('on');
  document.getElementById('demoWin').addEventListener('click', () => playSpin({ win:true }));
  document.getElementById('demoLose').addEventListener('click', () => playSpin({ win:false, forceKind:'LOSE' }));
  document.getElementById('demoNear').addEventListener('click', () => playSpin({ win:false, forceKind:'NEAR' }));
  document.getElementById('demoReset').addEventListener('click', () => {
    try{
      Object.keys(localStorage).filter(k => k.startsWith('cockkkio_slot_result_')).forEach(k => localStorage.removeItem(k));
    }catch(e){}
    location.reload();
  });
}

/* ---------- init ---------- */
(async function init(){
  setSpinState('locked', '라운드 정보를 불러오는 중...');
  currentRound = await getCurrentRound();
  renderRound(currentRound);

  if(currentRound.status !== 'OPEN'){
    setSpinState('locked', currentRound.status === 'CLOSED' ? '이번 라운드는 마감되었어요' : '곧 새로운 라운드가 열려요');
    return;
  }

  const p = await checkParticipation(keyringId, currentRound.roundNumber);
  if(p.participated){
    already = p.result;
    setSpinState('already', '이번 라운드는 이미 참여하셨어요');
    // 이전 결과를 즉시 재표시 (재스핀 없이)
    const symbols = already.symbols || (already.win ? ['logo','logo','logo'] : ['court','badge','court']);
    reelEls.forEach((reelEl, i) => {
      const h = reelItemHeight(reelEl);
      const idx = (LOOPS-2)*SEQUENCE.length + SEQUENCE.indexOf(symbols[i]);
      reelEl.style.transition = 'none';
      reelEl.style.transform = `translateY(${-(idx*h)}px)`;
    });
  }else{
    setSpinState('ready', '');
  }
})();
</script>
